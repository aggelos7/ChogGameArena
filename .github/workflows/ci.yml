# CI baseline (STORY-007): full frontend, backend and Compose checks on every PR and push to
# develop/master. Nx Cloud is not used. Every job always runs (no path filters or partial runs).
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  frontend:
    name: Frontend (Nx)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Workspace checks (skeleton, Compose config, secret scan)
        run: npm run test:workspace

      - name: Lint, test and build frontend projects
        run: npx nx run-many --targets=lint,test,build --exclude=backend --outputStyle=static

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: choggames
          POSTGRES_USER: choggames
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choggames -d choggames"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHOG_TEST_POSTGRES: Host=localhost;Port=5432;Database=choggames;Username=choggames;Password=ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore ChogGames.sln

      - name: Build
        run: dotnet build ChogGames.sln --no-restore --configuration Release

      - name: Test (incl. PostgreSQL integration tests)
        run: >-
          dotnet test ChogGames.sln --no-build --configuration Release
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/TestResults/*.trx
          if-no-files-found: warn

      - name: Restore dotnet-ef
        run: dotnet tool restore

      - name: Model has no changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/ChogGames.Infrastructure --startup-project src/ChogGames.Infrastructure

      - name: Migrations apply to an empty database
        env:
          Database__ConnectionString: Host=localhost;Port=5432;Database=chog_ci_migrations;Username=choggames;Password=ci-only-password
        run: >-
          dotnet ef database update
          --project src/ChogGames.Infrastructure --startup-project src/ChogGames.Infrastructure

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

      - name: Smoke test (healthy services, data survives restart)
        run: npm run deps:verify
