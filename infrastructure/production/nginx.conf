# Reverse proxy and static host (STORY-045, DEC-049): one origin for the web app and the API (DEC-013).
# HTTPS is added in STORY-046.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker's DNS, re-asked every 10 s: when an upgrade recreates the API container with a new
    # address, nginx follows it without a restart (a plain upstream resolves only at startup).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Every proxied request names the client nginx saw, overwriting whatever the client sent, so the
    # API's per-client rate limits can't be dodged by a spoofed X-Forwarded-For. proxy_set_header is
    # repeated in each location because a location that sets any inherits none from here.
    proxy_http_version 1.1;

    # The SignalR hub: WebSockets only, long-lived.
    location /api/hubs/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Hashed bundles (main-ABCD1234.js) never change. Everything else, index.html above all, is
    # revalidated so a release is picked up at once.
    location ~* "-[a-z0-9]{8,}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
