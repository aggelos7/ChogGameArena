# Response headers for every HTTPS response (STORY-045, STORY-046, DEC-050). Included by the server and
# again by each location that sets its own add_header, since those inherit none.
# HSTS: one year, this host only (no includeSubDomains, no preload), so other subdomains are unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
# A safety net against mixed content: the browser fetches any stray http:// subresource over https.
add_header Content-Security-Policy "upgrade-insecure-requests" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
