# Production-like stack on one Linux VM (STORY-045, DEC-049): nginx (web app + /api proxy over HTTPS),
# the API, a one-shot migration job, PostgreSQL and Redis, plus certbot for the Let's Encrypt
# certificate in the `letsencrypt` profile (STORY-046, DEC-050) and encrypted database backups in the
# `backup` profile (STORY-047, DEC-051); .env.example turns both on. Only nginx
# publishes ports (80 and 443); the rest share an internal network. Data lives in named volumes, so
# recreating containers keeps it.
# Usage: copy infrastructure/production/.env.example to infrastructure/production/.env (git-ignored,
# chmod 600), set the values, then:
#   docker compose -f infrastructure/production/docker-compose.yml up -d --build --wait
# See docs/deployment.md.
name: ${COMPOSE_PROJECT_NAME:-chog-game-arena-prod}

# Every service logs to Docker's json-file driver, rotated so logs can't fill the disk: at most 5 files
# of 10 MB each per container (STORY-048, DEC-052). The API writes one JSON object per line.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-choggames}
  POSTGRES_USER: ${POSTGRES_USER:-choggames}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infrastructure/production/.env (see .env.example)}
    volumes:
      # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Not used by the API yet (ADR-010: optional cache and future SignalR backplane); kept in the
  # topology with persistence so adding it later changes no deployment shape.
  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Applies pending EF Core migrations, then exits; the API starts only after it succeeds.
  migrate:
    image: ${IMAGE_PREFIX:-chog-game-arena}/migrate:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/api.Dockerfile
      target: migrate
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-choggames};Username=${POSTGRES_USER:-choggames};Password=${POSTGRES_PASSWORD}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-chog-game-arena}/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/api.Dockerfile
      target: api
    restart: unless-stopped
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trusts X-Forwarded-For/-Proto from any sender: the API publishes no port, so only nginx,
      # which overwrites both headers, can reach it.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-choggames};Username=${POSTGRES_USER:-choggames};Password=${POSTGRES_PASSWORD}
      # The address users open; wallets show it on sign-in (DEC-015). Override only for a
      # non-standard port (the smoke test).
      WalletAuth__Domain: ${WALLET_AUTH_DOMAIN:-${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in infrastructure/production/.env (see .env.example)}}
      WalletAuth__Uri: ${WALLET_AUTH_URI:-https://${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in infrastructure/production/.env (see .env.example)}}
      Nfts__Monad__RpcUrl: ${MONAD_RPC_URL:-https://rpc.monad.xyz}
      Games__Items__0__Status: ${CHOG_LIFE_STATUS:-ComingSoon}
      Games__Items__1__Status: ${CHOG_RACE_STATUS:-ComingSoon}
      # Shown on the terms and privacy pages; set it before the launch (DEC-070).
      Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-}
      # Wallets of the operators who review photo reports; none by default (DEC-070).
      Moderation__OperatorWallets: ${MODERATION_OPERATOR_WALLETS:-}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${IMAGE_PREFIX:-chog-game-arena}/web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in infrastructure/production/.env (see .env.example)}
    ports:
      # Port 80 only answers the ACME challenge and redirects to HTTPS.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      # Written by certbot only; nginx reads the certificate and serves the challenge tokens.
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy

  # Obtains the certificate for PUBLIC_HOSTNAME (HTTP-01 through nginx's webroot), then checks twice a
  # day and renews it within 30 days of expiry; nginx picks up a new certificate within a minute.
  # Needs PUBLIC_HOSTNAME's DNS pointing at the VM and port 80 reachable from the internet.
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [letsencrypt]
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in infrastructure/production/.env (see .env.example)}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        if [ -n "$$CERTBOT_EMAIL" ]; then contact="--email $$CERTBOT_EMAIL"; else contact=--register-unsafely-without-email; fi
        while :; do
          if certbot certonly --webroot -w /var/www/certbot --cert-name chog -d "$$PUBLIC_HOSTNAME" \
              --non-interactive --agree-tos --no-eff-email $$contact --keep-until-expiring; then
            wait_seconds=43200
          else
            wait_seconds=3600
          fi
          sleep "$$wait_seconds" & wait $$!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy

  # Encrypted PostgreSQL backups (STORY-047, DEC-051), in the `backup` profile (.env.example turns it on):
  # daily at BACKUP_TIME (UTC), pg_dump encrypted with age to BACKUP_AGE_RECIPIENT, kept in the `backups`
  # volume and copied to the S3-compatible bucket; 7 daily + 4 weekly kept in both places. Also runs a
  # backup on demand (`run --rm backup now`), lists archives and restores (see docs/deployment.md).
  backup:
    image: ${IMAGE_PREFIX:-chog-game-arena}/backup:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/production/backup.Dockerfile
    profiles: [backup]
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-choggames}
      PGUSER: ${POSTGRES_USER:-choggames}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-chog-game-arena}
      # Alerting (STORY-048, DEC-052): pinged after every successful backup, so a missed one raises an alert at
      # the monitor (e.g. healthchecks.io); the fail URL, if set, is pinged when a scheduled backup fails.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_HEARTBEAT_FAIL_URL: ${BACKUP_HEARTBEAT_FAIL_URL:-}
      # The off-VM copy: any S3-compatible store through rclone, configured from the environment only.
      RCLONE_CONFIG_OFFSITE_TYPE: ${BACKUP_REMOTE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # The key may write objects without being allowed to create or list buckets.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backups:/backups
    networks: [backend]
    # Healthy once the scheduler has checked its key and bucket settings; without them it never is, so
    # `up --wait` fails instead of starting the stack without backups.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/chog-backup-ready"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  letsencrypt:
  acme-webroot:
  backups:
