<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>
<header class="shell-header">
  <div class="header-top">
    <a class="brand" routerLink="/">Chog Game Arena</a>
    @if (session.player(); as player) {
      <p class="player">Playing as <strong>{{ player.displayName }}</strong></p>
    } @else if (session.status() === 'error') {
      <p class="player player-error" role="status">
        Guest sign-in unavailable
        <button type="button" (click)="session.ensureGuest()">Retry</button>
      </p>
    }
  </div>
  <nav aria-label="Main">
    <ul>
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </li>
      <li><a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">Games</a></li>
      <li><a routerLink="/chogs" routerLinkActive="active" ariaCurrentWhenActive="page">My Chogs</a></li>
      <li><a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profile</a></li>
    </ul>
  </nav>
  @if (navigation.navigating()) {
    <div class="nav-progress" role="progressbar" aria-label="Loading page"></div>
  }
</header>
<main #main id="main-content" class="shell-main" tabindex="-1" [attr.aria-busy]="navigation.navigating()">
  @if (navigation.failedUrl()) {
    <app-error-state
      class="nav-error"
      message="This page could not be loaded. Check your connection and try again."
      retryLabel="Reload page"
      (retry)="navigation.retry()"
    />
  }
  <router-outlet />
</main>
